# Flatmate web app (Expo web export of the mobile app). Installed as /etc/nginx/sites-available/flatmate-web
server {
    listen 80;
    server_name flatmate.ismailabbasi.qzz.io;
    root /srv/ismail_data/expense-management/web;
    index index.html;

    # Service worker and manifest must never be cached, or new deploys are never picked up
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.json { add_header Cache-Control "no-cache"; }

    # Bundles are content-hashed, safe to cache forever
    location /_expo/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /assets/ { expires 30d; }

    # Single-page app: unknown paths load the app
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
