# Throwaway Postgres + Redis for `npm test` (tmpfs: nothing persists). See test/README.md.
name: expense-test
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: expense, POSTGRES_PASSWORD: expense, POSTGRES_DB: expense_management_test }
    ports: ["127.0.0.1:55439:5432"]
    tmpfs: [/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
